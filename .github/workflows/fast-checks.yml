name: Fast Checks

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust Workspace + Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check all workspace targets
        run: cargo check --workspace --all-targets
      - name: Test the Rust core
        run: cargo test -p tt3de-core
      - name: Verify the core dependency tree is PyO3-free
        shell: bash
        run: |
          cargo tree -p tt3de-core | tee /tmp/tt3de-core-tree.txt
          if grep -E '(^|[[:space:]])pyo3([[:space:]-]|$)' /tmp/tt3de-core-tree.txt; then
            echo "tt3de-core must not depend on PyO3 packages" >&2
            exit 1
          fi

  python-build-and-tests:
    name: Maturin Develop + Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --group dev
      - name: Build extension in develop mode
        run: uv run maturin develop --uv
      - name: Run Python tests
        run: uv run pytest
